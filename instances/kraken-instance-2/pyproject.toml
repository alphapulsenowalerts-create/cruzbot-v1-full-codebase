[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-day-trading-bot"
version = "0.1.0"
description = "Modular asyncio paper day-trading bot with risk controls"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.9.0",
  "websockets>=12.0",
  "pydantic>=2.5.0",
  "pydantic-settings>=2.1.0",
  "pandas>=2.1.0",
  "numpy>=1.26.0",
  "pandas-ta>=0.3.14b",
  "python-dotenv>=1.0.0",
  "coinbase-advanced-py>=1.8.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.23.0"]
postgres = ["psycopg[binary]>=3.1.0"]

[project.scripts]
agentic-day-trading-bot = "main:main"

[tool.setuptools.packages.find]
include = ["trading_bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
